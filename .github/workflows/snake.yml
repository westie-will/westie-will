name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#4D92FF&color_dots=#0A0A0A,#0C2D6B,#1450B8,#1F6FEB,#9CC3FF
            dist/snake-light.svg?color_snake=#1F6FEB&color_dots=#EBEDF0,#C6DBFF,#7AA9FF,#1F6FEB,#0C2D6B

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
